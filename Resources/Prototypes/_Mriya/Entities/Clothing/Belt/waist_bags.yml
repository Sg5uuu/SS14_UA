  components:
  - type: Sprite
    sprite: _Mriya/Clothing/Belt/cheres.rsi
  - type: Clothing
    sprite: _Mriya/Clothing/Belt/cheres.rsi
  - type: Storage
    grid:
    - 0,0,3,1
    blacklist:
      tags:
      - Bartka
  - type: ItemSlots
    allowSmartEquip: true
    slots:
      item:
        name: Bartka
        insertVerbText: cheres-insert-bartka-verb
        ejectVerbText: cheres-eject-bartka-verb
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        whitelist:
          tags:
          - Bartka
  - type: ItemMapper
    sprite: _Mriya/Clothing/Belt/cheres.rsi
    mapLayers:
      icon-bartka:
        whitelist:
          tags:
          - Bartka
  - type: Appearance
  - type: Item
    size: Ginormous
    shape:
    - 0,0,4,1