- type: entity
  id: SmokingPipeFaika
  parent: SmokingPipe
  name: файка
  description: Пахне смерекою та тютюном.
  components:
  - type: Sprite
    sprite: _Mriya/Objects/Consumables/Smokeables/Pipes/faika.rsi
    state: unlit-icon
  - type: Clothing
    sprite: _Mriya/Objects/Consumables/Smokeables/Pipes/faika.rsi
    slots: [ mask ]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
    sprite: _Mriya/Objects/Consumables/Smokeables/Pipes/faika.rsi

- type: entity
  id: SmokingPipeFaikaFilledTobacco
  parent: SmokingPipeFaika
  name: файка
  suffix: Тютюн
  description: Пахне смерекою та тютюном.
  components:
  - type: ContainerContainer
    containers:
      bowl_slot: !type:ContainerSlot
  - type: ItemSlots
  - type: SmokingPipe
    bowl_slot:
      name: smoking-pipe-slot-component-slot-name-bowl
      startingItem: GroundTobacco
      whitelist:
        tags:
        - Smokable
      insertSound:
        path: /Audio/Weapons/Guns/Empty/empty.ogg
      ejectSound:
        path: /Audio/Weapons/Guns/Empty/empty.ogg

